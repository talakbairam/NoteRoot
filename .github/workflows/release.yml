name: Release

# Runs when develop is merged into master. It builds the .vsix, adds the tag for the version in
# package.json and attaches the .vsix to the release. It does not publish to the Marketplace.
# Raise "version" in package.json before merging into master: a tag that exists already stops the run.
on:
  push:
    branches: [master]

permissions:
  contents: write

# Two releases never run at once, and a running one is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run compile

      - name: Read the version
        id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # The changelog must have a section for this version, with a date (not "Unreleased").
      - name: Check the changelog
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          version="${TAG#v}"
          line=$(grep -F "## [$version]" CHANGELOG.md | head -n 1 || true)
          if [ -z "$line" ]; then
            echo "::error::CHANGELOG.md has no section for version $version."
            exit 1
          fi
          case "$line" in
            *Unreleased*) echo "::error::The section for $version in CHANGELOG.md still says Unreleased. Put the release date."; exit 1 ;;
          esac

      - name: Check that the tag is new
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "::error::The tag $TAG exists already. Raise the version in package.json."
            exit 1
          fi

      - name: Package
        run: npx vsce package --no-dependencies

      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release create "$TAG" ./*.vsix --target "$GITHUB_SHA" --title "$TAG" --generate-notes
